# Declarative semantic model spec.
#
# Drop a spec like this + a Parquet file matching `source`, and the model is
# queryable — no Python. This is the "connect anything" contract: any connector
# that can emit rows (date x dimensions x measures) + a spec gets cross-filter,
# drill-down, and dynamic-calculation support for free.
#
# `source` is a Parquet glob; client-partitioned files (data/<client>/ga4.parquet)
# are unioned. Add a `client` column + a `client` dimension for per-client filtering.
#
# Column provenance (live extractor = extract_ga4.py, GA4 Data API runReport):
#   sessions <- sessions          users <- totalUsers
#   page_views <- screenPageViews conversions <- keyEvents (GA4's conversions)
#   engaged_sessions <- sessions x engagementRate (stored additively; the
#     engagement_rate measure below re-derives the ratio at any grain)
# device / country / revenue exist only in the demo seed data — live GA4 rows
# are client x date x channel. Don't mix demo and live files in one lake
# (schemas differ); see INGESTION.md.
model: ga4
source: "data/**/ga4.parquet"
description: "Website analytics by channel / device / country"
time_dimension: date
dimensions:
  client: _.client
  date: _.date
  channel: _.channel
  device: _.device
  country: _.country
measures:
  users: _.users.sum()
  sessions: _.sessions.sum()
  page_views: _.page_views.sum()
  conversions: _.conversions.sum()
  engaged_sessions: _.engaged_sessions.sum()
  revenue: _.revenue.sum()
  # Dynamic calculations — defined once, correct at any grain:
  revenue_per_user: _.revenue.sum() / _.users.sum()
  conversion_rate: _.conversions.sum() / _.sessions.sum()
  engagement_rate: _.engaged_sessions.sum() / _.sessions.sum()
  pages_per_session: _.page_views.sum() / _.sessions.sum()
