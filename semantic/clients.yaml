# Client registry for the Python extractors (slug -> provider ids).
#
# !! KEEP IN SYNC with app/config/clients.ts (the Next app's registry). !!
# That file is TypeScript, so the extractors cannot read it directly; when a
# client is added/removed or a GA4 property changes there, mirror the change
# here (and vice versa). Slugs must match the app's slugs exactly — they become
# the `client` column in the Parquet lake and the dashboard's client filter.
#
# Fields per client:
#   ga4_property            GA4 property id (numeric, as a string) — extract_ga4.py
#   google_ads_customer_id  Google Ads customer id, digits or 123-456-7890 form —
#                           extract_google_ads.py. All currently unknown; fill in
#                           per client as Ads access is granted (template below).
